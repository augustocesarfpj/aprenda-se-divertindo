<style>

*{box-sizing:border-box}

/* gráfico de barras empilhadas em SVG */
function bars(rows,series,opts){
  const W=760,H=220,L=36,R=8,T=14,B=26,n=rows.length;if(!n)return'<p class="small">Sem dados no período.</p>';
  const max=Math.max(1,...rows.map(r=>series.reduce((a,s)=>a+(+r[s.k]||0),0)));
  const step=(W-L-R)/n,bw=Math.max(2,Math.min(28,step*.7));const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,Math.round(max/2),max];let g='';
  ticks.forEach(t=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+num(t)+'</text>'});
  const every=Math.ceil(n/12);
  rows.forEach((r,i)=>{let acc=0;const x=L+i*step+(step-bw)/2;const tip=esc(dd(r.dia))+": "+series.map(s=>s.n+" "+num(r[s.k])).join(" · ");
    g+='<g><title>'+tip+'</title>';series.forEach(s=>{const v=+r[s.k]||0;if(!v)return;g+='<rect x="'+x+'" y="'+y(acc+v)+'" width="'+bw+'" height="'+(y(acc)-y(acc+v))+'" fill="'+s.c+'" rx="2"/>';acc+=v});g+='</g>';
    if(i%every===0||i===n-1)g+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+dd(r.dia)+'</text>'});
  return'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label)+'">'+g+'</svg></div><div class="legend">'+series.map(s=>'<span><i style="background:'+s.c+'"></i>'+s.n+'</span>').join("")+'</div>';
}
function tile(v,label,sub){return'<div class="tile"><b>'+num(v)+'</b><span>'+label+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</div>'}
function vGeral(v){
  const t=ST.data.tot,R=ST.data.res,hoje=R.length?R[R.length-1]:{};const hojeStr=new Date(Date.now()-3*36e5).toISOString().slice(0,10),h=String(hoje.dia)===hojeStr?hoje:{};
  const sum=k=>R.reduce((a,r)=>a+(+r[k]||0),0),vis=sum("visitantes"),cn=sum("contas_novas");
  v.innerHTML='<div class="panel"><div class="row" style="justify-content:space-between"><h2>Hoje</h2><span class="small">dia '+dd(hojeStr)+' (horário de Brasília)</span></div><div class="tiles">'+tile(h.visitantes,"visitantes")+tile(h.contas_novas,"contas novas")+tile((+h.partidas_com_conta||0)+(+h.partidas_sem_conta||0),"partidas",num(h.partidas_sem_conta)+" sem conta")+tile(h.jogadores_com_conta,"jogadores com conta")+'</div></div>'
  +'<div class="panel"><div class="row" style="justify-content:space-between"><h2>Período</h2><div class="row" role="group" aria-label="Período">'+[7,30,90].map(d=>'<button class="chip" data-d="'+d+'" aria-pressed="'+(ST.dias===d)+'">'+d+' dias</button>').join("")+'</div></div>'
  +'<div class="tiles">'+tile(vis,"visitantes no período")+tile(cn,"contas novas",vis?Math.round(cn/vis*100)+"% dos visitantes":"")+tile(sum("partidas_com_conta")+sum("partidas_sem_conta"),"partidas no período",num(sum("partidas_sem_conta"))+" sem conta")+tile(t.ativos_7d,"ativos nos últimos 7 dias",num(t.ativos_30d)+" em 30 dias")+'</div>'
  +'<h3 style="margin-top:6px">Partidas por dia</h3>'+bars(R,[{k:"partidas_com_conta",n:"com conta",c:"var(--money)"},{k:"partidas_sem_conta",n:"sem conta",c:"var(--alt)"}],{label:"Partidas por dia"})
  +'<h3 style="margin-top:6px">Visitantes e contas novas por dia</h3>'+bars(R.map(r=>Object.assign({},r,{visitantes_sem:Math.max(0,(+r.visitantes||0)-(+r.contas_novas||0))})),[{k:"contas_novas",n:"contas novas",c:"var(--money)"},{k:"visitantes_sem",n:"outros visitantes",c:"var(--alt)"}],{label:"Visitantes e contas novas por dia"})+'</div>'
  +'<div class="panel"><h2>Desde o lançamento</h2><div class="tiles">'+tile(t.contas,"contas",num(t.contas_7d)+" nos últimos 7 dias")+tile(t.partidas,"partidas",num(t.partidas_7d)+" nos últimos 7 dias")+tile(t.milhoes,"vezes que alguém chegou ao milhão")+tile(t.questoes,"questões no banco")+tile(t.rankings,"rankings")+tile(t.disputas_7d,"disputas em 7 dias",num(t.saques_7d)+" saques")+tile(t.em_estudo,"pessoas estudando com cartões",num(t.cartoes)+" cartões")+'</div></div>';
  v.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ST.dias=+b.dataset.d;load()});
}
function vRet(v){
  const R=ST.data.ret;const pct=(a,b)=>b?Math.round(a/b*100):0;

  v.innerHTML='<div class="panel"><h2>Quem volta a jogar</h2><p class="small">Cada linha é a semana em que as contas foram criadas (segunda a domingo). As colunas mostram quantas dessas contas jogaram na mesma semana e nas semanas seguintes. O número mais importante é a <b>semana +1</b>: quem volta na semana seguinte.</p>'
  +(R.length?'<div class="tablewrap"><table class="cohort"><thead><tr><th>Semana de cadastro</th><th class="n">Contas</th><th>Mesma semana</th><th>Semana +1</th><th>Semana +2</th><th>Semana +3</th><th>Semana +4</th></tr></thead><tbody>'+R.map(r=>{const w=new Date(r.semana+"T12:00:00-03:00").getTime(),f=k=>w+k*7*864e5>now;return'<tr><td>'+dd(r.semana)+'</td><td class="n">'+r.contas+'</td>'+cell(r.s0,r.contas,false)+cell(r.s1,r.contas,f(1))+cell(r.s2,r.contas,f(2))+cell(r.s3,r.contas,f(3))+cell(r.s4,r.contas,f(4))+'</tr>'}).join("")+'</tbody></table></div>':'<p class="small">Ainda não há contas no período.</p>')
  +'<p class="small">Meta do plano de marketing: 40% ou mais voltando na semana +1. A semana atual ainda está em andamento.</p></div>';

    else if(r.opcoes.some(o=>!o))r.erro="falta alternativa";
    else if(new Set(r.opcoes.map(o=>nrm(o))).size<4)r.erro="alternativas repetidas";
    if(!r.erro){const s=qsSimilar(r.enunciado,r.opcoes[0]);if(s.length)r.parecida=s[0]}
    out.push(r)});
  const seenT=new Set();out.forEach(r=>{const k=nrm(r.enunciado);if(!r.erro&&seenT.has(k))r.erro="repetida dentro do lote";seenT.add(k)});
  return out;
}
function qErr(e){const m=String(e&&e.message||"");const T={QUESTAO_ID:"O arquivo tem uma questão com número inválido.",QUESTAO_MATERIA:"Escolha a matéria.",QUESTAO_NIVEL:"Escolha o nível.",QUESTAO_ENUNCIADO:"O enunciado está curto demais.",QUESTAO_OPCOES:"São 4 alternativas.",QUESTAO_OPCAO_VAZIA:"Preencha as 4 alternativas.",QUESTAO_OPCAO_REPETIDA:"Há alternativas repetidas.",LISTA_GRANDE:"No máximo 500 questões por vez.",NAO_ENCONTRADA:"Questão não encontrada."};
  for(const k in T)if(m.includes(k))return T[k]+(m.match(/\(linha \d+\)/)?" "+m.match(/\(linha \d+\)/)[0]:"");if(m.includes("Could not find"))return"Rode o arquivo 58-admin-questoes.sql no Supabase.";return errMsg(e)}

async function vQue(v){
  if(!QS.all){v.innerHTML='<div class="panel"><p class="small">Carregando o banco de questões…</p></div>';await qsLoad();if(ST.tab!=="questoes")return}
  if(QS.err&&!QS.all){v.innerHTML='<div class="panel"><p class="flash" role="alert">'+esc(QS.err)+'</p></div>';return}
  const E=QS.edit,f=QS.f,o=E?E.opcoes:["","","",""];
  const meus=QS.all.filter(q=>q.id>=1000000).length;
  v.innerHTML=(QS.msg?'<p class="flash ok" role="status">'+esc(QS.msg)+'</p>':'')+(QS.err?'<p class="flash" role="alert">'+esc(QS.err)+'</p>':'')
  +'<div class="panel"><div class="row" style="justify-content:space-between"><h2>'+(E?'Editar a questão nº '+E.id:'Lançar uma questão')+'</h2><span class="small">'+num(QS.all.length)+' questões ativas no banco · '+num(meus)+' lançadas por aqui</span></div>'
  +'<p class="small">A questão entra no jogo assim que é salva. A alternativa certa vai no campo verde; o jogo embaralha a ordem para o jogador.</p>'
  +'<form class="qform" id="qf"><div class="grid2"><label class="small">Trilha (filtra as matérias)<select id="qTr">'+trOpts(f.tr,true)+'</select></label><label class="small">Matéria<select id="qMat" required>'+subjOpts(f.tr,E?E.materia:f.m)+'</select></label><label class="small">Nível<select id="qNiv">'+nivOpts(E?E.nivel:f.n)+'</select></label></div>'
  +'<label class="small">Enunciado<textarea id="qEnun" rows="3" required>'+esc(E?E.enunciado:"")+'</textarea></label>'
  +'<div class="grid2"><label class="small qok">✔ Alternativa certa<input type="text" id="qO0" required value="'+esc(o[0])+'"></label><label class="small">Errada 1<input type="text" id="qO1" required value="'+esc(o[1])+'"></label><label class="small">Errada 2<input type="text" id="qO2" required value="'+esc(o[2])+'"></label><label class="small">Errada 3<input type="text" id="qO3" required value="'+esc(o[3])+'"></label></div>'
  +'<label class="small">Explicação (aparece depois da resposta)<textarea id="qExp" rows="2">'+esc(E?E.explicacao:"")+'</textarea></label>'
  +'<div id="qWarn" class="qwarn" aria-live="polite"></div>'
  +'<div class="row"><button class="btn" type="submit" id="qSave">'+(E?'Salvar alterações':'Lançar questão')+'</button>'+(E?'<button class="btn ghost" type="button" id="qCancel">Cancelar edição</button>':'<button class="btn ghost" type="button" id="qClear">Limpar</button>')+'</div></form></div>'
  +'<div class="panel"><h2>Lançar várias de uma vez</h2><p class="small">Cole aqui as linhas de uma planilha (Excel ou Google Planilhas), uma questão por linha, nesta ordem de colunas: <b>Matéria · Nível · Enunciado · Certa · Errada 1 · Errada 2 · Errada 3 · Explicação</b>. As colunas podem vir separadas por tabulação (copiar e colar da planilha) ou por ponto e vírgula. Nível: Fácil, Intermediária, Difícil, Muito difícil ou Desafio (ou 1 a 5). Até 500 por vez.</p>'
  +'<textarea id="qBulk" rows="6" placeholder="Dir. Penal;Fácil;Pegar a bolsa de alguém sem violência é:;Furto;Roubo;Extorsão;Dano;Sem violência ou ameaça, é furto."></textarea>'
  +'<div class="row"><button class="btn" type="button" id="qCheck">Conferir</button><button class="btn ghost" type="button" id="qModel">Baixar modelo de planilha</button></div><div id="qBulkOut"></div></div>'
  +'<div class="panel"><h2>Carregar arquivo de lote</h2><p class="small">Os arquivos .sql de questões que o Claude gera (por exemplo, <span class="mono">56-trilha-enem-13.sql</span>) podem ser carregados aqui, sem abrir o Supabase. As questões mantêm os números do arquivo; se alguma já existir, ela é atualizada. Arquivos que mudam outras partes do jogo (como planos ou rankings) continuam sendo rodados no Supabase.</p>'
  +'<div class="row"><label class="btn ghost" for="qFile" style="cursor:pointer">Escolher arquivo…</label><input type="file" id="qFile" accept=".sql,.json,.txt" multiple hidden><span class="small" id="qFileName">Nenhum arquivo escolhido</span></div><div id="qFileOut"></div></div>'
  +'<div class="panel"><h2>Buscar e editar</h2><div class="row qfilters"><input type="search" id="qSearch" placeholder="palavras do enunciado ou nº da questão" value="'+esc(QS.bq)+'" aria-label="Buscar questões"><select id="bTr" aria-label="Trilha">'+trOpts(QS.bf.tr,true)+'</select><select id="bMat" aria-label="Matéria"><option value="">Todas as matérias</option>'+subjOpts(QS.bf.tr,QS.bf.m)+'</select><select id="bNiv" aria-label="Nível">'+nivOpts(QS.bf.n,true)+'</select><select id="bSo" aria-label="Quais"><option value="">Ativas</option><option value="meus"'+(QS.bf.so==="meus"?" selected":"")+'>Lançadas por aqui</option><option value="off"'+(QS.bf.so==="off"?" selected":"")+'>Desativadas</option></select></div><div id="qList"></div></div>';
  // formulário
  const sel=$("qMat");if(!E&&f.m&&[...sel.options].some(x=>x.value===f.m))sel.value=f.m;
  $("qTr").onchange=()=>{f.tr=$("qTr").value;const cur=sel.value;sel.innerHTML=subjOpts(f.tr,cur);f.m=sel.value};
  sel.onchange=()=>{f.m=sel.value};$("qNiv").onchange=()=>{f.n=+$("qNiv").value};
  const warn=()=>{const en=$("qEnun").value,ops=[0,1,2,3].map(i=>$("qO"+i).value.trim());let h="";
    const sim=en.trim().length>=15?qsSimilar(en,ops[0],E&&E.id):[];
    if(sim.length)h+='<p class="flash warn">Parecida com questão que já existe:</p><ul class="small">'+sim.map(q=>'<li><b>nº '+q.id+'</b> ('+esc(SUBJ[q.materia]||q.materia)+', '+NIVEIS[q.nivel]+'): '+esc(q.enunciado)+' <i>→ '+esc((q.opcoes||[])[0])+'</i></li>').join("")+'</ul>';
    if(ops.every(Boolean)){const L=ops.map(x=>x.length),mx=Math.max(...L);if(L[0]===mx&&L.filter(x=>x===mx).length===1&&mx>L[1]+8&&mx>L[2]+8&&mx>L[3]+8)h+='<p class="small">Dica: a certa é bem mais longa que as erradas. Os jogadores costumam acertar pelo tamanho; vale alongar alguma errada.</p>';
      if(new Set(ops.map(nrm)).size<4)h+='<p class="flash">Há alternativas repetidas.</p>'}
    $("qWarn").innerHTML=h};
  ["qEnun","qO0","qO1","qO2","qO3"].forEach(id=>$(id).oninput=warn);warn();
  $("qf").onsubmit=async e=>{e.preventDefault();const b=$("qSave");b.disabled=true;
    const args={p_id:E?E.id:null,p_materia:sel.value,p_nivel:+$("qNiv").value,p_enunciado:$("qEnun").value,p_opcoes:[0,1,2,3].map(i=>$("qO"+i).value.trim()),p_explicacao:$("qExp").value};
    try{const id=await rpc("admin_questao_salvar",args);const row={id,materia:args.p_materia,nivel:args.p_nivel,enunciado:args.p_enunciado.trim(),opcoes:args.p_opcoes,explicacao:args.p_explicacao.trim(),ativa:E?E.ativa:true};row._t=toks(row.enunciado+" "+row.opcoes[0]);
      const list=row.ativa?QS.all:(QS.off||[]);const ix=list.findIndex(q=>q.id===id);if(ix>=0)list[ix]=row;else list.push(row);
      QS.msg=E?"Questão nº "+id+" atualizada.":"Questão nº "+id+" lançada ("+SUBJ[row.materia]+", "+NIVEIS[row.nivel]+"). Já está no jogo.";QS.edit=null;f.m=row.materia;f.n=row.nivel;vQue(v)}
    catch(err){alert(qErr(err));b.disabled=false}};
  if($("qCancel"))$("qCancel").onclick=()=>{QS.edit=null;QS.msg="";vQue(v)};
  if($("qClear"))$("qClear").onclick=()=>{QS.msg="";vQue(v)};
  // em lote
  const out=$("qBulkOut");
  const drawBulk=()=>{const R=QS.bulk||[];if(!R.length){out.innerHTML="";return}const ok=R.filter(r=>!r.erro);
    out.innerHTML='<p class="small"><b>'+ok.length+'</b> prontas para lançar · '+(R.length-ok.length)+' com problema · '+ok.filter(r=>r.parecida).length+' parecidas com questões do banco (desmarque se forem repetidas)</p><div class="tablewrap" style="max-height:50vh"><table><thead><tr><th>Lançar</th><th>Linha</th><th>Matéria</th><th>Nível</th><th>Enunciado</th><th>Certa</th><th>Situação</th></tr></thead><tbody>'
    +R.map((r,i)=>'<tr><td>'+(r.erro?'':'<input type="checkbox" data-bi="'+i+'"'+(r.skip?'':' checked')+' aria-label="Lançar linha '+r.linha+'">')+'</td><td class="n">'+r.linha+'</td><td>'+esc(r.materia?SUBJ[r.materia]:(r.raw[0]||""))+'</td><td>'+(r.nivel!=null?NIVEIS[r.nivel]:esc(r.raw[1]||""))+'</td><td style="white-space:normal;min-width:260px">'+esc(r.enunciado)+'</td><td style="white-space:normal">'+esc(r.opcoes[0])+'</td><td style="white-space:normal">'+(r.erro?'<span class="pill bad">'+esc(r.erro)+'</span>':r.parecida?'<span class="pill warn">parecida com nº '+r.parecida.id+'</span><br><span class="small">'+esc(r.parecida.enunciado)+'</span>':'<span class="pill ok">ok</span>')+'</td></tr>').join("")+'</tbody></table></div>'
    +'<div class="row"><button class="btn" type="button" id="qGo"'+(ok.length?'':' disabled')+'>Lançar '+ok.filter(r=>!r.skip).length+' questões</button></div>';
    out.querySelectorAll("[data-bi]").forEach(c=>c.onchange=()=>{R[+c.dataset.bi].skip=!c.checked;drawBulk()});
    if($("qGo"))$("qGo").onclick=async()=>{const go=R.filter(r=>!r.erro&&!r.skip);if(!go.length)return;if(!confirm("Lançar "+go.length+" questões no jogo?"))return;$("qGo").disabled=true;
      try{const r=await rpc("admin_questoes_importar",{p_lista:go.map(x=>({materia:x.materia,nivel:x.nivel,enunciado:x.enunciado,opcoes:x.opcoes,explicacao:x.explicacao}))});
        QS.msg=r.inseridas+" questões lançadas (nº "+r.primeiro_id+" a "+r.ultimo_id+"). Já estão no jogo.";QS.bulk=null;await qsLoad(true);vQue(v)}
      catch(err){alert(qErr(err));$("qGo").disabled=false}}};
  $("qCheck").onclick=()=>{QS.bulk=parseBulk($("qBulk").value);drawBulk()};
  $("qModel").onclick=()=>csvDown("modelo-questoes",["Matéria","Nível","Enunciado","Certa","Errada 1","Errada 2","Errada 3","Explicação"],[["Dir. Penal","Fácil","Pegar a bolsa de alguém, sem violência e sem a pessoa perceber, é:","Furto","Roubo","Extorsão","Dano","Sem violência ou grave ameaça, o crime é furto."]]);
  drawBulk();
  // arquivo de lote
  const fo=$("qFileOut");
  $("qFile").onchange=async()=>{const files=[...$("qFile").files];if(!files.length)return;$("qFileName").textContent=files.map(f=>f.name).join(", ");fo.innerHTML='<p class="small">Lendo…</p>';
    const rows=[],probs=[],heads=[];
    for(const f of files){const t=await f.text();let L=null;const h=(t.split("\n")[0]||"").replace(/^--\s*/,"").trim();
      try{const a=t.indexOf("$q$");if(a>=0){const b=t.indexOf("$q$",a+3);L=JSON.parse(t.slice(a+3,b))}else if(t.trim().startsWith("["))L=JSON.parse(t)}catch(e){L=null}
      if(!Array.isArray(L)){probs.push(f.name+": não é um arquivo de lote de questões. Se for um arquivo que muda o jogo (planos, rankings, administração), rode pelo Supabase.");continue}
      heads.push(h||f.name);
      L.forEach((r,i)=>{const ok=Number.isInteger(r.id)&&r.id>=0&&r.id<1000000&&SUBJ[r.materia]&&r.nivel>=0&&r.nivel<=4&&r.enunciado&&Array.isArray(r.opcoes)&&r.opcoes.length===4&&new Set(r.opcoes.map(nrm)).size===4;
        if(ok)rows.push({id:r.id,materia:r.materia,nivel:r.nivel,enunciado:r.enunciado,opcoes:r.opcoes,explicacao:r.explicacao||r.e||""});else probs.push(f.name+", questão "+(i+1)+(r&&r.id!=null?" (nº "+r.id+")":"")+": dados incompletos")})}
    const byId=new Map();rows.forEach(r=>byId.set(r.id,r));const U=[...byId.values()];
    const have=new Set(QS.all.concat(QS.off||[]).map(q=>q.id)),novas=U.filter(r=>!have.has(r.id)).length;
    const bySub={};U.forEach(r=>{(bySub[r.materia]=bySub[r.materia]||[0,0,0,0,0])[r.nivel]++});
    fo.innerHTML=(heads.length?'<p class="small"><b>'+esc(heads.join(" · "))+'</b></p>':'')
      +(U.length?'<p class="small"><b>'+num(U.length)+'</b> questões no arquivo · <b>'+num(novas)+'</b> novas · '+num(U.length-novas)+' já estão no banco (serão atualizadas)</p><div class="tablewrap" style="max-height:40vh"><table><thead><tr><th>Matéria</th>'+NIVEIS.map(n=>'<th class="n">'+n+'</th>').join("")+'<th class="n">Total</th></tr></thead><tbody>'+Object.entries(bySub).map(([m,p])=>'<tr><td>'+esc(SUBJ[m])+'</td>'+p.map(x=>'<td class="n">'+x+'</td>').join("")+'<td class="n"><b>'+p.reduce((a,b)=>a+b,0)+'</b></td></tr>').join("")+'</tbody></table></div>':'')
      +(probs.length?'<p class="flash">'+probs.slice(0,8).map(esc).join("<br>")+(probs.length>8?'<br>… e mais '+(probs.length-8):'')+'</p>':'')
      +(U.length?'<div class="row"><button class="btn" type="button" id="qLoad">Carregar '+num(U.length)+' questões</button></div><p class="small" id="qLoadMsg" role="status"></p>':'');
    if($("qLoad"))$("qLoad").onclick=async()=>{const b=$("qLoad");b.disabled=true;let nv=0,at=0;
      try{for(let i=0;i<U.length;i+=500){$("qLoadMsg").textContent="Carregando "+Math.min(i+500,U.length)+" de "+U.length+"…";const r=await rpc("admin_questoes_carregar",{p_lista:U.slice(i,i+500)});nv+=r.novas;at+=r.atualizadas}
        QS.msg="Arquivo carregado: "+nv+" questões novas e "+at+" atualizadas. Já estão no jogo.";await qsLoad(true);vQue(v)}
      catch(e){$("qLoadMsg").textContent=qErr(e)+(nv+at?" ("+(nv+at)+" já tinham sido carregadas.)":"");b.disabled=false}}};
  // busca
  const list=$("qList");
  const drawList=()=>{const q=nrm(QS.bq).trim(),F=QS.bf;const base=F.so==="off"?(QS.off||[]):F.so==="meus"?QS.all.filter(x=>x.id>=1000000):QS.all;
    const subs=F.tr&&TRACKS[F.tr]?TRACKS[F.tr].s:null;
    let R=base.filter(x=>(!subs||subs.includes(x.materia))&&(!F.m||x.materia===F.m)&&(F.n===""||String(x.nivel)===String(F.n)));
    if(q){if(/^\d+$/.test(q))R=R.filter(x=>String(x.id)===q);else{const w=q.split(/\s+/);R=R.filter(x=>{const t=nrm(x.enunciado+" "+(x.opcoes||[]).join(" "));return w.every(p=>t.includes(p))})}}
    const tot=R.length;R=R.slice().sort((a,b)=>b.id-a.id).slice(0,50);
    list.innerHTML='<p class="small">'+num(tot)+' questões'+(tot>50?' (mostrando as 50 mais novas; refine a busca)':'')+'</p><div class="qlist">'+(R.length?R.map(x=>'<div class="qitem"><div><span class="small">nº '+x.id+' · '+esc(SUBJ[x.materia]||x.materia)+' · '+NIVEIS[x.nivel]+'</span><p>'+esc(x.enunciado)+'</p><p class="small">✔ '+esc((x.opcoes||[])[0])+' · ✘ '+esc((x.opcoes||[]).slice(1).join(" · "))+'</p></div><div class="row"><button class="btn ghost" data-ed="'+x.id+'">Editar</button><button class="btn ghost" data-tg="'+x.id+'">'+(x.ativa?'Desativar':'Reativar')+'</button></div></div>').join(""):'<p class="small">Nada encontrado.</p>')+'</div>';
    list.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{const x=QS.all.concat(QS.off||[]).find(y=>y.id===+b.dataset.ed);QS.edit=x;QS.msg="";vQue(v);window.scrollTo({top:0,behavior:"smooth"})});
    list.querySelectorAll("[data-tg]").forEach(b=>b.onclick=async()=>{const id=+b.dataset.tg,x=QS.all.concat(QS.off||[]).find(y=>y.id===id);if(x.ativa&&!confirm("Desativar a questão nº "+id+"? Ela some do jogo (dá para reativar depois)."))return;b.disabled=true;
      try{await rpc("admin_questao_ativar",{p_id:id,p_ativa:!x.ativa});if(x.ativa){QS.all=QS.all.filter(y=>y.id!==id);x.ativa=false;(QS.off=QS.off||[]).unshift(x)}else{QS.off=QS.off.filter(y=>y.id!==id);x.ativa=true;QS.all.push(x)}drawList()}catch(e){alert(qErr(e));b.disabled=false}})};
  const qs=$("qSearch");qs.oninput=()=>{QS.bq=qs.value;drawList()};
  $("bTr").onchange=()=>{QS.bf.tr=$("bTr").value;QS.bf.m="";$("bMat").innerHTML='<option value="">Todas as matérias</option>'+subjOpts(QS.bf.tr,"");drawList()};
  $("bMat").onchange=()=>{QS.bf.m=$("bMat").value;drawList()};$("bNiv").onchange=()=>{QS.bf.n=$("bNiv").value;drawList()};$("bSo").onchange=()=>{QS.bf.so=$("bSo").value;drawList()};
  drawList();
}
boot();
</script>
