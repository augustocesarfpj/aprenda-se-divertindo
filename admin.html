/* gráfico de barras empilhadas em SVG */
function bars(rows,series,opts){
  const W=760,H=220,L=36,R=8,T=14,B=26,n=rows.length;if(!n)return'<p class="small">Sem dados no período.</p>';
  const max=Math.max(1,...rows.map(r=>series.reduce((a,s)=>a+(+r[s.k]||0),0)));
  const step=(W-L-R)/n,bw=Math.max(2,Math.min(28,step*.7));const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,Math.round(max/2),max];let g='';
  ticks.forEach(t=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+num(t)+'</text>'});
  const every=Math.ceil(n/12);
  rows.forEach((r,i)=>{let acc=0;const x=L+i*step+(step-bw)/2;const tip=esc(dd(r.dia))+": "+series.map(s=>s.n+" "+num(r[s.k])).join(" · ");
    g+='<g><title>'+tip+'</title>';series.forEach(s=>{const v=+r[s.k]||0;if(!v)return;g+='<rect x="'+x+'" y="'+y(acc+v)+'" width="'+bw+'" height="'+(y(acc)-y(acc+v))+'" fill="'+s.c+'" rx="2"/>';acc+=v});g+='</g>';
    if(i%every===0||i===n-1)g+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+dd(r.dia)+'</text>'});
  return'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label)+'">'+g+'</svg></div><div class="legend">'+series.map(s=>'<span><i style="background:'+s.c+'"></i>'+s.n+'</span>').join("")+'</div>';
}

  +'<p class="small">“Fáceis vistas” compara com o total de questões fáceis da trilha preferida do jogador: <span class="pill warn">80%+</span> está perto de começar a ver as intermediárias no lugar das fáceis já vistas.</p>'
  +'<div class="tablewrap" style="max-height:70vh"><table><thead><tr>'+col.map(([key,n,nn])=>'<th class="sort'+(nn?' n':'')+'" data-k="'+key+'" aria-sort="'+(k===key?(d>0?"ascending":"descending"):"none")+'">'+n+(k===key?(d>0?" ▲":" ▼"):"")+'</th>').join("")+'</tr></thead><tbody>'
  +rows.map(r=>{const p=POOL[r.trilha]||POOL.geral,fp=p[0]?Math.round(r.faceis_vistas/p[0]*100):0,pill=fp>=100?'<span class="pill bad">'+fp+'%</span>':fp>=80?'<span class="pill warn">'+fp+'%</span>':'<span class="small">'+fp+'%</span>';
    return'<tr><td><b>'+esc(r.nome)+'</b><br><span class="small">'+esc(r.email)+'</span></td><td>'+dt(r.criado_em)+'</td><td title="'+esc(r.ultimo_jogo||"")+'">'+ago(r.ultimo_jogo)+'</td><td class="n">'+num(r.partidas)+'</td><td class="n">'+num(r.partidas_7d)+'</td><td class="n">'+(r.melhor_premio?brl(r.melhor_premio):"–")+(r.milhoes>1?' <span class="small">×'+r.milhoes+'</span>':'')+'</td><td>'+esc(TRACKS[r.trilha]?TRACKS[r.trilha].n:(r.trilha||"–"))+'</td><td class="n">'+num(r.faceis_vistas)+' '+pill+'</td><td class="n">'+num(r.intermediarias_vistas)+'</td><td class="n">'+num(r.cartoes)+'</td><td class="n">'+num(r.rankings)+'</td></tr>'}).join("")+'</tbody></table></div></div>';
  const qs=$("qs");qs.oninput=()=>{ST.q=qs.value;const pos=qs.selectionStart;vJog(v);const n=$("qs");n.focus();n.setSelectionRange(pos,pos)};
  v.querySelectorAll("th.sort").forEach(th=>th.onclick=()=>{const key=th.dataset.k;ST.sort=ST.sort.k===key?{k:key,d:-ST.sort.d}:{k:key,d:["nome","email","trilha"].includes(key)?1:-1};vJog(v)});
  $("csv").onclick=()=>{const cc=[["nome","Nome"],["email","E-mail"]].concat(col.slice(1));const head=cc.map(c=>c[1]);const lines=[head.join(";")].concat(rows.map(r=>cc.map(([key])=>{let x=r[key];if(key==="trilha"&&TRACKS[x])x=TRACKS[x].n;return'"'+String(x==null?"":x).replace(/"/g,'""')+'"'}).join(";")));
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"}));a.download="jogadores-"+new Date().toISOString().slice(0,10)+".csv";a.click()};
}
function vCont(v){
  pools();const T=ST.data.tri;const byTr={};T.forEach(r=>{const o=byTr[r.trilha]=byTr[r.trilha]||{p:0,j:0,a:0,m:{}};o.p+=r.partidas;o.a+=r.sem_conta;o.m[r.modo]=(o.m[r.modo]||0)+r.partidas+r.sem_conta});
  const total=Object.values(byTr).reduce((a,o)=>a+o.p+o.a,0)||1;
  const bySub={};ST.data.que.forEach(r=>{(bySub[r.materia]=bySub[r.materia]||[0,0,0,0,0])[r.nivel]+=r.qtd});
  v.innerHTML='<div class="panel"><h2>Questões e uso por trilha</h2><p class="small">Questões disponíveis em cada trilha (matérias comuns, como Português, contam em várias) e partidas dos últimos '+ST.dias+' dias.</p><div class="tablewrap"><table><thead><tr><th>Trilha</th>'+NIVEIS.map(n=>'<th class="n">'+n+'</th>').join("")+'<th class="n">Total</th><th class="n">Partidas</th><th class="n">Sem conta</th><th>Participação</th></tr></thead><tbody>'
  +Object.entries(TRACKS).map(([k,t])=>{const p=POOL[k],o=byTr[k]||{p:0,a:0},sh=Math.round((o.p+o.a)/total*100);return'<tr><td><b>'+esc(t.n)+'</b></td>'+p.map(x=>'<td class="n">'+num(x)+'</td>').join("")+'<td class="n"><b>'+num(p.reduce((a,b)=>a+b,0))+'</b></td><td class="n">'+num(o.p)+'</td><td class="n">'+num(o.a)+'</td><td>'+sh+'%<span class="bar" style="width:'+Math.max(2,sh)+'px"></span></td></tr>'}).join("")
  +'</tbody></table></div><p class="small">Total no banco: '+num(ST.data.tot.questoes)+' questões.</p></div>'
  +'<div class="panel"><h2>Partidas por trilha e modo</h2><div class="tablewrap"><table><thead><tr><th>Trilha</th><th>Modo</th><th class="n">Com conta</th><th class="n">Jogadores</th><th class="n">Sem conta</th></tr></thead><tbody>'
  +(T.length?T.map(r=>'<tr><td>'+esc(TRACKS[r.trilha]?TRACKS[r.trilha].n:r.trilha)+'</td><td>'+esc({classico:"Prova",desafio:"Desafio do dia",disputa:"Disputa"}[r.modo]||r.modo)+'</td><td class="n">'+num(r.partidas)+'</td><td class="n">'+num(r.jogadores)+'</td><td class="n">'+num(r.sem_conta)+'</td></tr>').join(""):'<tr><td colspan="5" class="small">Sem partidas no período.</td></tr>')+'</tbody></table></div></div>'
  +'<div class="panel"><h2>Questões por matéria</h2><div class="tablewrap" style="max-height:60vh"><table><thead><tr><th>Matéria</th>'+NIVEIS.map(n=>'<th class="n">'+n+'</th>').join("")+'<th class="n">Total</th></tr></thead><tbody>'
  +Object.entries(bySub).sort((a,b)=>b[1].reduce((x,y)=>x+y,0)-a[1].reduce((x,y)=>x+y,0)).map(([m,p])=>'<tr><td>'+esc(SUBJ[m]||m)+'</td>'+p.map(x=>'<td class="n">'+num(x)+'</td>').join("")+'<td class="n"><b>'+num(p.reduce((a,b)=>a+b,0))+'</b></td></tr>').join("")+'</tbody></table></div></div>';
}
function vRk(v){
  const R=ST.data.rk;
  v.innerHTML='<div class="panel"><div class="row" style="justify-content:space-between"><h2>Rankings</h2><span class="small">'+R.length+' rankings · '+R.filter(r=>r.saque).length+' com Sábado do Saque</span></div><div class="tablewrap"><table><thead><tr><th>Ranking</th><th>Administrador</th><th class="n">Participantes</th><th class="n">Partidas na semana</th><th class="n">Disputas (7 dias)</th><th class="n">Saques (7 dias)</th><th>Saque</th><th>Criado em</th></tr></thead><tbody>'
  +(R.length?R.map(r=>'<tr><td><b>'+esc(r.nome)+'</b></td><td>'+esc(r.dono)+'</td><td class="n">'+num(r.membros)+'</td><td class="n">'+num(r.partidas_semana)+'</td><td class="n">'+num(r.disputas_7d)+'</td><td class="n">'+num(r.saques_7d)+'</td><td>'+(r.saque?'<span class="pill ok">ativo</span>':'<span class="small">desligado</span>')+'</td><td>'+dt(r.criado_em)+'</td></tr>').join(""):'<tr><td colspan="8" class="small">Nenhum ranking ainda.</td></tr>')+'</tbody></table></div><p class="small">“Partidas na semana” soma as partidas dos participantes desde segunda às 00h.</p></div>';
}
boot();
</script>
</body>
</html>
